<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 54" role="img" aria-label="Colitis Help USA">
  <title>Colitis Help USA</title>
  <!-- Teal rounded badge -->
  <rect x="3" y="3" width="46" height="48" rx="11" fill="#0E6B8E"/>
  <!-- Navy top accent (clips to rx corners naturally) -->
  <rect x="3" y="3" width="46" height="9" rx="11" fill="#0B2545"/>
  <rect x="3" y="8" width="46" height="4" fill="#0B2545"/>
  <!-- White leaf shape -->
  <path d="M26,44 Q13,36 15,23 Q17,11 26,13 Q35,11 37,23 Q39,36 26,44 Z" fill="white" opacity="0.95"/>
  <!-- Teal center vein -->
  <line x1="26" y1="44" x2="26" y2="13" stroke="#0E6B8E" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left veins -->
  <line x1="26" y1="34" x2="18" y2="28" stroke="#0E6B8E" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="26" y1="26" x2="18" y2="21" stroke="#0E6B8E" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Right veins -->
  <line x1="26" y1="34" x2="34" y2="28" stroke="#0E6B8E" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="26" y1="26" x2="34" y2="21" stroke="#0E6B8E" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Wordmark -->
  <text x="62" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.3">
    <tspan fill="#0B2545">Colitis Help</tspan><tspan fill="#C8902A"> USA</tspan>
  </text>
</svg>
