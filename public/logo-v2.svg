<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 54" role="img" aria-label="Colitis Help USA">
  <title>Colitis Help USA</title>
  <!-- Navy circle background -->
  <circle cx="27" cy="27" r="23" fill="#0B2545"/>
  <!-- Gold outer ring -->
  <circle cx="27" cy="27" r="23" fill="none" stroke="#C8902A" stroke-width="2.5"/>
  <!-- White heart: left bump -->
  <circle cx="20" cy="24" r="7.5" fill="white"/>
  <!-- White heart: right bump -->
  <circle cx="34" cy="24" r="7.5" fill="white"/>
  <!-- White heart: bottom V -->
  <polygon points="12,26 27,41 42,26" fill="white"/>
  <!-- Wordmark -->
  <text x="62" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.3">
    <tspan fill="#0B2545">Colitis Help</tspan><tspan fill="#C8902A"> USA</tspan>
  </text>
</svg>
